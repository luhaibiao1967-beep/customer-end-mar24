<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VividAqua</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #060d1a;
      }
      /* Sharp fixed background — avoids blur from background-attachment:fixed */
      #bg-layer {
        position: fixed;
        inset: 0;
        background: url('/background.png') no-repeat center/cover;
        z-index: -2;
        image-rendering: crisp-edges;
      }
      #bg-overlay {
        display: none;
      }
      h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="%BASE_URL%192-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%180-180.png" />
    <meta name="theme-color" content="#3b82f6" />
    <meta property="og:title" content="VividAqua" />
    <meta property="og:description" content="Water delivery customer portal" />
    <meta property="og:image" content="https://vividaqua.online/512-512.png" />
    <meta property="og:url" content="https://vividaqua.online/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
