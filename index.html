<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VividAqua</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        height: 100%;
        height: 100dvh;
      }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #e3f4f7;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
      html[data-theme="dark"] body {
        background-color: #060d1a;
      }
      /* Fills the real mobile viewport (avoids 100vh + iOS toolbar quirks) */
      #root {
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
      /* Light: clean cyan wash (matches app primary #00A8B5 family). Dark: photo. */
      #bg-layer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        z-index: -2;
        background: linear-gradient(
          165deg,
          #ecf8fa 0%,
          #d8eef3 38%,
          #c2e5eb 72%,
          #aad9e3 100%
        );
      }
      html[data-theme="dark"] #bg-layer {
        background: url('/background.png') no-repeat center/cover;
        image-rendering: crisp-edges;
      }
      #bg-overlay {
        display: none;
      }
      h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="%BASE_URL%192-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%180-180.png" />
    <meta name="theme-color" content="#7ec8d4" />
    <meta property="og:title" content="VividAqua" />
    <meta property="og:description" content="Water delivery customer portal" />
    <meta property="og:image" content="https://vividaqua.online/512-512.png" />
    <meta property="og:url" content="https://vividaqua.online/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
